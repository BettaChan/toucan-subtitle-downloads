name: Verify macOS and FFmpeg draft downloads

on:
  push:
    branches: [build/windows-package-check]
    paths: [.github/workflows/windows-package-check.yml]

permissions: {}

jobs:
  verify:
    if: github.run_attempt == 1 && github.actor == 'BettaChan'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download four draft assets and revoke the job token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revoke() {
            curl --fail --silent --show-error --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/installation/token"
          }
          trap revoke EXIT
          mkdir "$RUNNER_TEMP/toucan-download-check"
          cd "$RUNNER_TEMP/toucan-download-check"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq 'map(select(.draft and (.name | endswith("1.2.02")))) | if length == 1 then .[0].assets else error("Expected one 1.2.02 draft") end' > assets.json
          for name in DazuiSubtitle-1.2.02-mac-arm64.dmg DazuiSubtitle-1.2.02-mac-arm64.zip ffmpeg-source-1.2.02.zip electron-44.0.0-ffmpeg-source.tar.gz; do
            asset_id=$(jq -er --arg name "$name" '.[] | select(.name == $name and .state == "uploaded") | .id' assets.json)
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            curl --fail --silent --show-error --location --max-time 180 \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/octet-stream' \
              --output "$name" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          revoke
          trap - EXIT
          unset GH_TOKEN
          echo 'Downloaded all four assets and revoked the job token.'

      - name: Check SHA-256 and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/toucan-download-check"
          sha256sum --strict -c <<'SUMS'
          52e0239c97a57b271d91f1cf2d8c6a17a7d4d4eeb5fc17470787df9c8d48b51c  DazuiSubtitle-1.2.02-mac-arm64.dmg
          d357af58aa1f7d29b18e0780cefdabca63acff91f6bc28e8f8aaf1ca130f691a  DazuiSubtitle-1.2.02-mac-arm64.zip
          e15f618c55d2ebe4b54dba048084132cc7846a3c761ec63e4d145050a851224a  ffmpeg-source-1.2.02.zip
          54bd54be5325af9163b6ccbda2a4ca665e0e97e2f643b5e9d8004407b827d076  electron-44.0.0-ffmpeg-source.tar.gz
          SUMS
          unzip -tq DazuiSubtitle-1.2.02-mac-arm64.zip
          unzip -tq ffmpeg-source-1.2.02.zip
          gzip -t electron-44.0.0-ffmpeg-source.tar.gz
          tar -tzf electron-44.0.0-ffmpeg-source.tar.gz > /dev/null
          echo 'All four SHA-256 checks and all three archive integrity checks passed.'
